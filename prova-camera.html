<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prova camera">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Prova fotocamera</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 -apple-system,system-ui,sans-serif}
button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:14px 16px;background:#2a2f2d;color:#fff;cursor:pointer}
button.main{background:#4cc29c;color:#04241b}
button:disabled{opacity:.45}
#app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));gap:8px}
#stage{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#111}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#hint{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-weight:650;text-shadow:0 1px 3px #000}
#bar{display:flex;gap:8px}
#bar button{flex:1}
#stats{font:12px/1.35 ui-monospace,Menlo,monospace;color:#b9c6c1;white-space:pre-wrap;max-height:22vh;overflow-y:auto;margin:0}
#res{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111}
#ocr{position:absolute;inset:0;overflow-y:auto;background:#111;padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <canvas id="ov"></canvas>
    <div id="hint">Tocca Avvia e inquadra un documento</div>
    <img id="res" alt="" hidden>
    <pre id="ocr" hidden></pre>
  </div>
  <pre id="stats"></pre>
  <div id="bar">
    <button class="main" id="go">Avvia</button>
    <button id="shot" hidden>Scatta ora</button>
    <button id="read" hidden>Leggi OCR</button>
  </div>
</div>
<script>
"use strict";
/* Pagina di prova, separata dall'app: rileva il foglio dal video e scatta da solo quando è fermo.
   Le funzioni di rilevamento e raddrizzamento sono copiate da index.html. */
function boxBlur(g,w,h,r){
  const tmp=new Float32Array(w*h),out=new Float32Array(w*h);
  for(let y=0;y<h;y++){let s=0;const o=y*w;for(let x=-r;x<=r;x++)s+=g[o+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){tmp[o+x]=s/(2*r+1);s+=g[o+Math.min(w-1,x+r+1)]-g[o+Math.max(0,x-r)]}}
  for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=s/(2*r+1);s+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x]}}
  return out;
}
/* il foglio è la macchia (chiara o scura, soglia di Otsu) più grande che tocca meno i bordi della foto */
function findPaper(src){
  const k=Math.min(1,360/Math.max(src.width,src.height)),w=Math.max(2,Math.round(src.width*k)),h=Math.max(2,Math.round(src.height*k)),n=w*h;
  const c=document.createElement("canvas");c.width=w;c.height=h;const cx=c.getContext("2d",{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
  const d=cx.getImageData(0,0,w,h).data;let g=new Float32Array(n);
  for(let i=0;i<n;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  g=boxBlur(boxBlur(g,w,h,2),w,h,2);
  const hist=new Float64Array(256);let sum=0;for(let i=0;i<n;i++){hist[g[i]|0]++;sum+=g[i]|0}
  let sB=0,wB=0,best=-1,th=128;
  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
  const lab=new Int32Array(n),st=new Int32Array(n),per=2*(w+h);let pick=null,id=0;
  for(const bright of [true,false]){
    const m=new Uint8Array(n);for(let i=0;i<n;i++)m[i]=(g[i]>th)===bright?1:0;
    for(let s=0;s<n;s++){if(!m[s]||lab[s])continue;id++;let top=0,area=0,edge=0;st[top++]=s;lab[s]=id;
      while(top){const p=st[--top],x=p%w,y=(p-x)/w;area++;if(x===0||y===0||x===w-1||y===h-1)edge++;
        if(x>0&&m[p-1]&&!lab[p-1]){lab[p-1]=id;st[top++]=p-1}
        if(x<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=id;st[top++]=p+1}
        if(y>0&&m[p-w]&&!lab[p-w]){lab[p-w]=id;st[top++]=p-w}
        if(y<h-1&&m[p+w]&&!lab[p+w]){lab[p+w]=id;st[top++]=p+w}}
      const score=area*Math.max(0,1-edge/per*2)*(bright?1:.8);
      if(!pick||score>pick.score)pick={id,score}}
  }
  if(!pick||pick.score<.08*n)return null;
  const pts=[];
  for(let y=0;y<h;y++){let a=-1,b=-1;for(let x=0;x<w;x++)if(lab[y*w+x]===pick.id){if(a<0)a=x;b=x}if(a>=0){pts.push([a,y+.5],[b+1,y+.5])}}
  const hp=hull(pts);if(hp.length<4)return null;
  let q=hp.slice();
  const tri=(a,b,c)=>Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]));
  while(q.length>4){let mi=0,mv=Infinity;for(let i=0;i<q.length;i++){const v=tri(q[(i+q.length-1)%q.length],q[i],q[(i+1)%q.length]);if(v<mv){mv=v;mi=i}}q.splice(mi,1)}
  /* affina: sposta ogni angolo sul vertice dell'involucro che dà il quadrilatero più grande */
  for(let it=0,better=true;better&&it<20;it++){better=false;
    for(let i=0;i<4;i++){let a=quadArea(q),bv=q[i];for(const v of hp){q[i]=v;const na=quadArea(q);if(na>a+1e-6&&quadOk(q,1,1)){a=na;bv=v;better=true}}q[i]=bv}}
  q=orderQuad(q.map(([x,y])=>[Math.min(src.width,Math.max(0,x/k)),Math.min(src.height,Math.max(0,y/k))]));
  return quadArea(q)>.1*src.width*src.height?q:null;
}
function hull(p){
  p=p.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
  for(const v of p){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],v)<=0)lo.pop();lo.push(v)}
  for(let i=p.length-1;i>=0;i--){const v=p[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],v)<=0)up.pop();up.push(v)}
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
/* ordine: alto-sinistra, alto-destra, basso-destra, basso-sinistra */
function orderQuad(q){
  const cx=q.reduce((s,v)=>s+v[0],0)/4,cy=q.reduce((s,v)=>s+v[1],0)/4;
  q=q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
  let s=0;for(let i=1;i<4;i++)if(q[i][0]+q[i][1]<q[s][0]+q[s][1])s=i;
  return q.slice(s).concat(q.slice(0,s));
}
function quadArea(q){let a=0;for(let i=0;i<4;i++){const p=q[i],r=q[(i+1)%4];a+=p[0]*r[1]-r[0]*p[1]}return Math.abs(a)/2}
function quadOk(q,W,H){
  let sg=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4],z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(z)<1e-6)return false;const s=Math.sign(z);if(sg&&s!==sg)return false;sg=s}
  return quadArea(q)>.01*W*H;
}
/* omografia che porta i 4 punti "from" sui 4 punti "to" */
function homography(from,to){
  const A=[],b=[];
  for(let i=0;i<4;i++){const [u,v]=from[i],[x,y]=to[i];A.push([u,v,1,0,0,0,-u*x,-v*x]);b.push(x);A.push([0,0,0,u,v,1,-u*y,-v*y]);b.push(y)}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
  return b.map((v,i)=>v/A[i][i]);
}
async function warp(src,q){
  const L=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.max(L(q[0],q[1]),L(q[3],q[2])),H=Math.max(L(q[0],q[3]),L(q[1],q[2]));
  const k=Math.min(1,1600/Math.max(W,H));W=Math.max(1,Math.round(W*k));H=Math.max(1,Math.round(H*k));
  const m=homography([[0,0],[W,0],[W,H],[0,H]],q),sw=src.width,sh=src.height,s=src.getContext("2d").getImageData(0,0,sw,sh).data;
  const out=document.createElement("canvas");out.width=W;out.height=H;const ox=out.getContext("2d"),od=ox.createImageData(W,H),o=od.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const u=x+.5,v=y+.5,z=m[6]*u+m[7]*v+1;
    const sx=Math.min(Math.max((m[0]*u+m[1]*v+m[2])/z-.5,0),sw-1.001),sy=Math.min(Math.max((m[3]*u+m[4]*v+m[5])/z-.5,0),sh-1.001);
    const x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,i0=(y0*sw+x0)*4,i1=i0+sw*4,j=(y*W+x)*4;
    for(let c=0;c<3;c++)o[j+c]=(s[i0+c]*(1-fx)+s[i0+4+c]*fx)*(1-fy)+(s[i1+c]*(1-fx)+s[i1+4+c]*fx)*fy;
    o[j+3]=255;
  }
  ox.putImageData(od,0,0);
  return await new Promise((res,rej)=>out.toBlob(b=>b?res(b):rej(),"image/jpeg",0.8));
}

const $=s=>document.querySelector(s),v=$("#v"),ov=$("#ov");
const STABLE_MS=900,MOVE_MAX=.03,LOOP_MS=120,ANALYSIS=640;
let stream=null,running=false,lastQ=null,stableSince=0,startedAt=0,busy=false,lastBlob=null,ocrP=null;
const small=document.createElement("canvas"),sx=small.getContext("2d",{willReadFrequently:true});
const S={resolution:"-",requested:"3840x2160",standalone:!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches),permissionMs:"-",detectMs:0,frames:0,found:0,captured:"-",sharpness:"-",output:"-",ocrMs:"-",ocrConf:"-",error:""};
const show=()=>{$("#stats").textContent=[
  "app da Home: "+(S.standalone?"sì":"no")+"   permesso: "+S.permissionMs+" ms",
  "video: "+S.resolution+"   (chiesto "+S.requested+")",
  "analisi: "+S.detectMs.toFixed(0)+" ms   foglio trovato: "+S.found+"/"+S.frames,
  "scatto dopo: "+S.captured+"   nitidezza: "+S.sharpness,
  "risultato: "+S.output+"   OCR: "+S.ocrMs+" ms, confidenza "+S.ocrConf,
  S.error?"ERRORE: "+S.error:""].filter(Boolean).join("\n")};
const hint=t=>{$("#hint").textContent=t};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function start(){
  S.error="";show();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("fotocamera non disponibile in questa pagina");
    const t0=performance.now();
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:3840},height:{ideal:2160}}});
    S.permissionMs=Math.round(performance.now()-t0);
    v.srcObject=stream;await v.play();
    for(let i=0;i<50&&!v.videoWidth;i++)await wait(100);
    if(!v.videoWidth)throw new Error("il video non parte");
    $("#go").textContent="Riprova";$("#go").classList.remove("main");$("#shot").hidden=false;
    live();
  }catch(e){S.error=(e.name||"")+" "+e.message;hint("Fotocamera non disponibile");show()}
}
function live(){
  $("#res").hidden=true;$("#ocr").hidden=true;$("#read").hidden=true;$("#shot").disabled=false;
  S.resolution=v.videoWidth+"x"+v.videoHeight;S.frames=0;S.found=0;S.captured="-";S.sharpness="-";S.output="-";S.ocrMs="-";S.ocrConf="-";
  lastQ=null;stableSince=0;startedAt=performance.now();running=true;hint("Inquadra il documento");show();loop();
}
async function loop(){
  while(running){
    const t0=performance.now();
    if(v.videoWidth&&!busy)analyse();
    await wait(Math.max(10,LOOP_MS-(performance.now()-t0)));
  }
}
function analyse(){
  const k=Math.min(1,ANALYSIS/Math.max(v.videoWidth,v.videoHeight));
  const w=Math.round(v.videoWidth*k),h=Math.round(v.videoHeight*k);
  if(small.width!==w||small.height!==h){small.width=w;small.height=h;ov.width=w;ov.height=h}
  sx.drawImage(v,0,0,w,h);
  const t0=performance.now();let q=null;try{q=findPaper(small)}catch(_){}
  S.detectMs=S.detectMs*.8+(performance.now()-t0)*.2;S.frames++;
  if(q&&(!quadOk(q,w,h)||quadArea(q)<.15*w*h))q=null;
  if(q)S.found++;
  const now=performance.now(),limit=MOVE_MAX*Math.max(w,h);
  const still=q&&lastQ&&q.every((p,i)=>Math.hypot(p[0]-lastQ[i][0],p[1]-lastQ[i][1])<limit);
  if(!q){stableSince=0;hint("Inquadra il documento")}
  else if(!still){stableSince=now;hint("Tieni fermo…")}
  lastQ=q;
  draw(q,stableSince?Math.min(1,(now-stableSince)/STABLE_MS):0);
  show();
  if(q&&stableSince&&now-stableSince>=STABLE_MS)capture(q.map(p=>[p[0]/k,p[1]/k]),"auto");
}
function draw(q,progress){
  const c=ov.getContext("2d");c.clearRect(0,0,ov.width,ov.height);if(!q)return;
  c.beginPath();q.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  c.fillStyle="rgba(76,194,156,"+(.12+.28*progress)+")";c.fill();c.lineWidth=3;c.strokeStyle="#4cc29c";c.stroke();
}
/* nitidezza: varianza del laplaciano sul centro del fotogramma */
function sharpness(cv){
  const W=cv.width,H=cv.height,n=Math.min(500,W,H),d=cv.getContext("2d").getImageData((W-n)>>1,(H-n)>>1,n,n).data,g=new Float32Array(n*n);
  for(let i=0;i<n*n;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  let s=0,s2=0,c=0;
  for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++){const i=y*n+x,l=g[i-1]+g[i+1]+g[i-n]+g[i+n]-4*g[i];s+=l;s2+=l*l;c++}
  return s2/c-(s/c)*(s/c);
}
function grab(){
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext("2d",{willReadFrequently:true}).drawImage(v,0,0,c.width,c.height);return c;
}
/* tre fotogrammi a piena risoluzione: tiene il più nitido, così una messa a fuoco in corso non rovina lo scatto */
async function capture(q,how){
  if(busy)return;busy=true;running=false;
  try{
    hint("Scatto…");$("#shot").disabled=true;
    const elapsed=((performance.now()-startedAt)/1000).toFixed(1);
    let best=null,bestS=-1;const all=[];
    for(let i=0;i<3;i++){const c=grab(),s=sharpness(c);all.push(Math.round(s));if(s>bestS){bestS=s;best=c}if(i<2)await wait(130)}
    const W=best.width,H=best.height,m=Math.round(Math.min(W,H)*.03);
    const blob=await warp(best,q||[[m,m],[W-m,m],[W-m,H-m],[m,H-m]]);
    lastBlob=blob;
    const url=URL.createObjectURL(blob),img=$("#res");
    if(img.src.startsWith("blob:"))URL.revokeObjectURL(img.src);
    img.src=url;await img.decode();img.hidden=false;
    S.captured=elapsed+" s ("+how+")";S.sharpness=all.join(", ");S.output=img.naturalWidth+"x"+img.naturalHeight+", "+Math.round(blob.size/1024)+" KB";
    ov.getContext("2d").clearRect(0,0,ov.width,ov.height);hint("");$("#read").hidden=false;
  }catch(e){S.error=(e.name||"")+" "+e.message;live()}
  finally{busy=false;show()}
}
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.append(s)});
function ocrWorker(){
  const base=new URL("ocr/",location.href).href;
  if(!ocrP)ocrP=(window.Tesseract?Promise.resolve():loadScript("ocr/tesseract.min.js"))
    .then(()=>Tesseract.createWorker("ita",1,{workerPath:base+"worker.min.js",corePath:base,langPath:base,gzip:true,workerBlobURL:false,cacheMethod:"none"}))
    .catch(e=>{ocrP=null;throw e});
  return ocrP;
}
async function readOcr(){
  const b=$("#read"),o=$("#ocr");
  if(!o.hidden){o.hidden=true;b.textContent="Leggi OCR";return}
  b.disabled=true;b.textContent="Leggo…";
  try{
    const t0=performance.now(),w=await ocrWorker(),{data}=await w.recognize(lastBlob);
    S.ocrMs=Math.round(performance.now()-t0);S.ocrConf=Math.round(data.confidence)+"%";
    o.textContent=data.text||"(nessun testo)";o.hidden=false;b.textContent="Vedi foto";
  }catch(e){S.error="OCR: "+e.message;b.textContent="Leggi OCR"}
  b.disabled=false;show();
}
$("#go").onclick=()=>{if(busy)return;if(stream){running=false;setTimeout(live,LOOP_MS+20)}else start()};
$("#shot").onclick=()=>{if(running&&v.videoWidth){const k=Math.max(v.videoWidth,v.videoHeight)/Math.max(small.width||1,small.height||1);capture(lastQ?lastQ.map(p=>[p[0]*k,p[1]*k]):null,"manuale")}};
$("#read").onclick=readOcr;
addEventListener("pagehide",()=>{running=false;if(stream)stream.getTracks().forEach(t=>t.stop())});
show();
</script>
</body>
</html>
